name: Validation (GSAS-II and pymatgen)

# Independent checks of the Rietveld, structure-refinement and crystal-geometry code: builds GSAS-II
# from source and installs pymatgen, writes reference fixtures to tests/fixtures/validation/ and
# commits them (and the anomalous-dispersion table data/reference/anomalous-dispersion.json), so the unit tests compare against programs that are not part of this repository.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/validation/**'
      - '.github/workflows/validation.yml'

permissions:
  contents: write

concurrency:
  group: validation-${{ github.ref }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GSAS2_COMMIT: 2c62562
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build GSAS-II from source and install pymatgen
        run: |
          git clone https://github.com/AdvancedPhotonSource/GSAS-II.git "$RUNNER_TEMP/GSAS-II"
          git -C "$RUNNER_TEMP/GSAS-II" checkout "$GSAS2_COMMIT"
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pymatgen
          python -m pip install "$RUNNER_TEMP/GSAS-II"
      - name: GSAS-II simulations and refinements
        run: python -I scripts/validation/gsas2/structure.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II size, microstrain, polarisation, roughness, transparency and Le Bail
        run: python -I scripts/validation/gsas2/sample.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II shared-site substitution (Zn0.85Mg0.15O)
        run: python -I scripts/validation/gsas2/substitution.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II axial divergence (FCJ), uniaxial size and Stephens microstrain (ZnO)
        run: python -I scripts/validation/gsas2/anisotropic.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II anomalous dispersion table, Henke cross-check and capillary absorption
        run: python -I scripts/validation/gsas2/dispersion.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II spherical-harmonic preferred orientation (every Laue class, ZnO refinement)
        run: python -I scripts/validation/gsas2/texture.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II sequential refinement of a ZnO series (and one by one)
        run: python -I scripts/validation/gsas2/sequential.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: GSAS-II bond lengths, angles and their s.u., bond-valence sums (ZrO2)
        run: python -I scripts/validation/gsas2/bonds.py "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load this site's exported GSAS-II files into GSAS-II
        # The first run only writes the files (it may fail against the old record), the last run
        # checks the new record.
        run: |
          GSAS_EXPORT_DIR="$RUNNER_TEMP/export" npx vitest run tests/validation-gsas-export.test.ts || true
          python -I scripts/validation/gsas2/load_export.py "$RUNNER_TEMP/export" "$GITHUB_WORKSPACE"
          npx vitest run tests/validation-gsas-export.test.ts
      - name: pymatgen distances and powder patterns
        run: python -I scripts/validation/pymatgen/check.py "$GITHUB_WORKSPACE"
      - name: Commit the fixtures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/validation data/reference/anomalous-dispersion.json
          if git diff --cached --quiet; then echo 'Fixtures unchanged.'; exit 0; fi
          git commit -m 'Validation fixtures from GSAS-II and pymatgen'
          git push
