name: Feedback worker

# Deploys the feedback service (worker-feedback/) with its D1 database to Cloudflare Workers when
# it changes on main, or on demand. Skips itself until the secrets in docs/feedback.md are added.
on:
  push:
    branches: [main]
    paths: ['worker-feedback/**', '.github/workflows/feedback-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROOF_SECRET: ${{ secrets.FEEDBACK_PROOF_SECRET }}
      ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER: npx --yes wrangler@4.152.0
    defaults:
      run:
        working-directory: worker-feedback
    steps:
      - uses: actions/checkout@v5
      - name: Check Cloudflare setup
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PROOF_SECRET" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::notice::Feedback worker deploy skipped: add the four secrets in docs/feedback.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Find or create the D1 database
        if: steps.setup.outputs.ready == 'true'
        run: |
          find_id() {
            $WRANGLER d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const db = JSON.parse(s).find((d) => d.name === "plot-bhai-feedback");
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            $WRANGLER d1 create plot-bhai-feedback
            id=$(find_id)
          fi
          test -n "$id"
          sed -i "s/REPLACE_WITH_DATABASE_ID/$id/" wrangler.toml
      - name: Create the tables
        if: steps.setup.outputs.ready == 'true'
        run: $WRANGLER d1 execute plot-bhai-feedback --remote --file=schema.sql
      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        run: $WRANGLER deploy
      - name: Set the secrets
        if: steps.setup.outputs.ready == 'true'
        run: |
          printf '%s' "$PROOF_SECRET" | $WRANGLER secret put PROOF_SECRET
          printf '%s' "$ADMIN_TOKEN" | $WRANGLER secret put ADMIN_TOKEN
